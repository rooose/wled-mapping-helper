<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Place your lights</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='place.css') }}">
</head>
<body>
  <header class="bar">
    <a class="btn small" href="{{ url_for('index') }}">Home</a>

    <div class="connect">
      <label class="field">Controller IP
        <input type="text" id="ip" placeholder="192.168.1.45" autocomplete="off">
      </label>
      <button type="button" id="connect" class="btn small">Connect</button>
      <label class="field narrow">LEDs
        <input type="number" id="count" min="1" max="2048" value="50">
      </label>
    </div>

    <p id="status" class="status" role="status">Not connected</p>
  </header>

  <main class="workspace">
    <div class="now">
      <h1 id="current">LED 0</h1>
      <p id="progress" class="muted">0 of 50 placed</p>
    </div>

    <div class="controls">
      <button type="button" id="prev" class="btn small">Previous</button>
      <button type="button" id="next" class="btn small">Skip</button>
      <button type="button" id="restore" class="btn small">Restore effects</button>
      <button type="button" id="clear" class="btn small">Clear all</button>
    </div>

    <canvas id="canvas" aria-label="Click where the lit LED is"></canvas>

    <p class="muted hint">
      Click where the lit LED is. Click a dot to light that LED again, and drag a dot to move it.
      Left and right arrow keys switch LEDs. Everything saves automatically.
    </p>
  </main>

  <script src="{{ url_for('static', filename='place.js') }}"></script>
</body>
</html>
